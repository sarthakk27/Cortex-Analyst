name: CORTEX_AI_JOIN
tables:
  - name: CUSTOMERS
    description: The table contains records of customers, including their identity and contact information. Each record represents a single customer and includes details about their location and when they joined.
    base_table:
      database: CORTEX
      schema: CORTEX_JOIN
      table: CUSTOMERS
    dimensions:
      - name: CITY
        description: The city associated with the customer.
        expr: CITY
        data_type: VARCHAR(16777216)
        sample_values:
          - Vadodara
          - Surat
          - Ahmedabad
      - name: CUSTOMER_ID
        description: Unique numeric identifier assigned to each customer.
        expr: CUSTOMER_ID
        data_type: NUMBER(38,0)
        sample_values:
          - '2'
          - '1'
          - '3'
      - name: CUSTOMER_NAME
        description: The full name of the customer.
        expr: CUSTOMER_NAME
        data_type: VARCHAR(16777216)
        sample_values:
          - Priya Patel
          - Amit Shah
          - Karan Mehta
      - name: EMAIL
        description: Email addresses associated with customers.
        expr: EMAIL
        data_type: VARCHAR(16777216)
        sample_values:
          - amit@gmail.com
          - rahul@gmail.com
          - priya@gmail.com
    time_dimensions:
      - name: SIGNUP_DATE
        description: The date on which a customer signed up.
        expr: SIGNUP_DATE
        data_type: DATE
        sample_values:
          - '2025-01-10'
          - '2025-02-01'
          - '2025-01-15'
    primary_key:
      columns:
        - CUSTOMER_ID
  - name: ORDERS
    description: The table contains records of customer orders. Each record represents a single order and includes details about the customer, order date, financial totals, and delivery information.
    base_table:
      database: CORTEX
      schema: CORTEX_JOIN
      table: ORDERS
    dimensions:
      - name: CUSTOMER_ID
        description: The unique identifier assigned to each customer.
        expr: CUSTOMER_ID
        data_type: NUMBER(38,0)
        sample_values:
          - '2'
          - '3'
          - '1'
      - name: DELIVERY_NOTE
        description: Special instructions or notes provided by the customer regarding the delivery of an order.
        expr: DELIVERY_NOTE
        data_type: VARCHAR(16777216)
        sample_values:
          - Call before delivery
          - Deliver after 6 PM
          - Gift wrap this order
      - name: ORDER_ID
        description: Unique identifier assigned to each order.
        expr: ORDER_ID
        data_type: NUMBER(38,0)
        sample_values:
          - '1001'
          - '1002'
          - '1003'
    time_dimensions:
      - name: ORDER_DATE
        description: The date on which an order was placed.
        expr: ORDER_DATE
        data_type: DATE
        sample_values:
          - '2026-04-01'
          - '2026-04-02'
          - '2026-04-03'
    facts:
      - name: TOTAL_AMOUNT
        description: The total monetary amount associated with an order.
        expr: TOTAL_AMOUNT
        data_type: NUMBER(10,2)
        access_modifier: public_access
        sample_values:
          - '18000.00'
          - '5000.00'
          - '25000.00'
    primary_key:
      columns:
        - ORDER_ID
    foreign_keys:
      - fkey_columns:
          - CUSTOMER_ID
        pkey_table:
          database: CORTEX
          schema: CORTEX_JOIN
          table: CUSTOMERS
        pkey_columns:
          - CUSTOMER_ID
  - name: ORDER_ITEMS
    description: The table contains records of individual line items within orders, capturing product and pricing details. Each record represents a single item and includes information about the associated order, product identity, quantity, pricing, and customer feedback.
    base_table:
      database: CORTEX
      schema: CORTEX_JOIN
      table: ORDER_ITEMS
    dimensions:
      - name: CUSTOMER_REVIEW
        description: Customer reviews submitted for purchased order items.
        expr: CUSTOMER_REVIEW
        data_type: VARCHAR(16777216)
        sample_values:
          - Works smoothly
          - Camera quality is amazing
          - Excellent performance
      - name: ITEM_ID
        description: Unique identifier for each item within an order.
        expr: ITEM_ID
        data_type: NUMBER(38,0)
        sample_values:
          - '1'
          - '3'
          - '2'
      - name: ORDER_ID
        description: The unique identifier for an order.
        expr: ORDER_ID
        data_type: NUMBER(38,0)
        sample_values:
          - '1001'
          - '1002'
          - '1003'
      - name: PRODUCT_NAME
        description: The name of the product associated with an order item.
        expr: PRODUCT_NAME
        data_type: VARCHAR(16777216)
        sample_values:
          - Laptop
          - Mouse
          - Smartphone
      - name: QUANTITY
        description: The number of units ordered for a given order item.
        expr: QUANTITY
        data_type: NUMBER(38,0)
        sample_values:
          - '1'
          - '2'
    facts:
      - name: UNIT_PRICE
        description: The price per individual unit of an ordered item.
        expr: UNIT_PRICE
        data_type: NUMBER(10,2)
        access_modifier: public_access
        sample_values:
          - '3000.00'
          - '18000.00'
          - '22000.00'
    primary_key:
      columns:
        - ITEM_ID
    foreign_keys:
      - fkey_columns:
          - ORDER_ID
        pkey_table:
          database: CORTEX
          schema: CORTEX_JOIN
          table: ORDERS
        pkey_columns:
          - ORDER_ID
relationships:
  - name: ORDERS_TO_CUSTOMERS
    left_table: ORDERS
    right_table: CUSTOMERS
    relationship_columns:
      - left_column: CUSTOMER_ID
        right_column: CUSTOMER_ID
    relationship_type: many_to_one
    join_type: inner
  - name: ORDER_ITEMS_TO_ORDERS
    left_table: ORDER_ITEMS
    right_table: ORDERS
    relationship_columns:
      - left_column: ORDER_ID
        right_column: ORDER_ID
    relationship_type: many_to_one
    join_type: inner